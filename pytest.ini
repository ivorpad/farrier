[pytest]
; Keep collection to farrier's own tests. eval-workspaces/ holds foreign repo
; clones (their tests need deps we don't install, and their .farrier/hooks
; copies collide with src/templates/hooks test module names); .claude/ holds
; agent worktrees whose hook-test copies collide the same way. ruff already
; skips them via .gitignore; pytest needs the explicit list.
norecursedirs = eval-workspaces node_modules .git .farrier-staging docs .claude
